# Risk limits. Code enforces these; Claude can read them but never change them.

[budget]
capital = 800000.0     # total virtual budget the bot may use (paper account capped at 1 M USD; CHANGELOG 12/10/2026).
                       # init and every run refuse to start if the account's net liquidation in EUR is below this.
                       # Raising it needs `journal_cli.py topup --confirm` to deposit the difference into the ledger.
currency = "EUR"       # base currency for all accounting

[limits]
max_position_pct = 2.0          # no single holding above 2% of portfolio value (checked at entry)
min_position_pct = 0.5          # no line below 0.5% after a BUY, or left after a partial SELL (full SELL always allowed)
max_sector_pct = 20.0           # per `sector` column of the universe CSVs
max_us_pct = 70.0               # holdings with country US
max_equity_pct = 90.0           # all holdings: cash stays >= 10%
reentry_cooldown_days = 10      # business days with no BUY of an instrument after its stop was hit
max_trades_per_month = 60       # orders submitted per calendar month (Paris time); raised from 10 per CLAUDE.md §4
max_drawdown_pct = 15.0         # kill switch: fall >= 15% from peak -> sell all, halt, manual reset
# Drawdown tiers below the kill switch (CLAUDE.md §4, CHANGELOG 12/10/2026). Must satisfy
# drawdown_resume_pct < drawdown_pause_pct < drawdown_reduce_pct < max_drawdown_pct.
drawdown_pause_pct = 8.0        # NORMAL -> PAUSED: no BUY for drawdown_pause_days business days
drawdown_pause_days = 5
drawdown_reduce_pct = 12.0      # -> REDUCED: no BUY while equity > reduce_max_equity_pct; no forced sale (stops only)
reduce_max_equity_pct = 50.0
drawdown_resume_pct = 4.0       # after PAUSED or REDUCED: BUYs at half max_position_pct until drawdown < this
daily_loss_halt_pct = 3.0       # a day's loss > 3% (close to close) blocks every order the next day, except stops
max_price_deviation_pct = 0.5   # fat-finger guard: limit price must be within 0.5% of reference price
max_commission_pct = 1.0        # block orders whose commission exceeds 1% of order value
allow_fractional = false        # IBKR rejects fractional orders via API (error 10243, verified 2026-09-21)

# Only instruments in these CSV files may be traded
# (columns: symbol,exchange,currency,name,sector,country,source; every field required, fail-closed).
# exchange: SMART for US; SBF, AEB, IBIS, LSE or EBS (primary exchange, orders still route via SMART).
# No files / empty files = nothing can be bought (fail-closed). Refresh: scripts/refresh_universe.py
[universe]
files = [
  "config/universe/us_core.csv",   # S&P 500 + Nasdaq-100 (CLAUDE.md §3)
  "config/universe/eu_core.csv",   # STOXX 600 on SBF/AEB/IBIS/LSE/EBS
]
hedge_files = ["config/universe/hedge.csv"]   # pocket C: IWDA (benchmark), CSPX, EXSA, short EUR bonds
enable_hedge = false   # phase 1: hedge instruments are never shown to Claude and the gate blocks them

# Pocket A ranking, computed by code from the bar cache (scripts/refresh_bars.py, weekends).
# Claude receives the top_n with their scores and never recomputes them (CHANGELOG 12/10/2026, T2b).
[momentum]
top_n = 40
lookback_days = 126    # ~6 months of trading days
skip_days = 21         # minus the last month
max_atr_pct = 6.0      # volatility filter: ATR14/price above this is excluded (2xATR stop would hit the -12% floor)
max_age_days = 10      # cached history older than this is not used (missing data is flagged, never filled in)
min_traded_value = 5000000.0   # CLAUDE.md §3 liquidity: 20-day avg close x volume, USD (US) / EUR (EU), from the bar cache
