# Risk limits. Code enforces these; Claude can read them but never change them.

[budget]
capital = 800000.0     # total virtual budget the bot may use (paper account capped at 1 M USD; CHANGELOG 12/10/2026).
                       # init and every run refuse to start if the account's net liquidation in EUR is below this.
                       # Raising it needs `journal_cli.py topup --confirm` to deposit the difference into the ledger.
currency = "EUR"       # base currency for all accounting

[limits]
max_position_pct = 25.0         # no single holding above 25% of portfolio value
max_trades_per_month = 10       # orders submitted per calendar month (Paris time)
max_drawdown_pct = 25.0         # kill switch: fall >= 25% from peak -> sell all, halt, manual reset
max_price_deviation_pct = 2.0   # fat-finger guard: limit price must be within 2% of reference price
max_commission_pct = 10.0       # block orders whose commission exceeds 10% of order value
allow_fractional = false        # IBKR rejects fractional orders via API (error 10243, verified 2026-09-21)

# Only instruments in these CSV files may be traded (columns: symbol,exchange,currency,name,source).
# No files / empty files = nothing can be bought (fail-closed).
# US stocks/ETFs: exchange SMART, currency USD.
[universe]
files = [
  "config/universe/my_picks.csv",  # owner's own picks
  "config/universe/top_sp500.csv",   # + 33 largest S&P 500 by market cap = 50. Refresh monthly: scripts/refresh_universe.py
]
# config/universe/qus_sp500.csv (full QUS / S&P 500 list) is kept for reference but not traded.
