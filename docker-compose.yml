# guardrail-trader in Docker (branch: docker)
#
#   docker compose build
#   docker compose up -d            # ib-gateway + bot (scheduler) + dashboard
#   docker compose logs -f bot
#   docker compose down
#
# Files you provide (all gitignored):
#   .env                              bot settings + ANTHROPIC_API_KEY (same format as .env.example)
#   docker/gateway.env                TWS_USERID=<paper/trial username>
#   docker/secrets/tws_password.txt   IBKR password
#   docker/secrets/vnc_password.txt   VNC password (for watching the gateway login screen)
#
# Gateway host ports avoid the native IB Gateway (4002/5900). The dashboard uses 8765, so run
# `scripts/launchd.sh docker-mode` first (stops the native scheduler + dashboard, keeps keep-awake).
# IBKR allows ONE session per username: only one of native IB Gateway / ib-gateway container
# can be logged in at a time.
name: guardrail-docker

services:
  ib-gateway:
    # No settings volume: IBC re-applies config from env on every start (a fresh named
    # volume is root-owned and IB Gateway runs as uid 1000 -> 'jts.ini: Permission denied').
    # "stable" channel 10.45.1h, pinned by digest (Dependabot bumps it)
    image: ghcr.io/gnzsnz/ib-gateway:10.45.1h@sha256:d39c30526f2c20b37fa5ae89d81057e93d9c37fccd11120b68d8d2b1f2c80b66
    restart: unless-stopped
    env_file: docker/gateway.env                   # TWS_USERID
    environment:
      TRADING_MODE: paper
      TWS_PASSWORD_FILE: /run/secrets/tws_password
      VNC_SERVER_PASSWORD_FILE: /run/secrets/vnc_password
      READ_ONLY_API: "no"                  # our code has its own read-only mode
      TWS_ACCEPT_INCOMING: accept
      BYPASS_WARNING: "yes"
      TIME_ZONE: Europe/Paris
      AUTO_RESTART_TIME: "04:00 AM"        # daily restart, 04:00 Paris = outside EU and US sessions (CLAUDE.md §10)
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      # Never kick an existing session (e.g. a native IB Gateway still logged in).
      EXISTING_SESSION_DETECTED_ACTION: secondary
    secrets:
      - tws_password
      - vnc_password
    networks: [broker, gateway_egress]   # broker: bot only; egress: IBKR servers
    ports:
      # socat inside the image forwards 0.0.0.0:4004 -> 127.0.0.1:4002, so IB Gateway still
      # only ever sees localhost connections. 4004 is reachable from this compose network;
      # the host mapping below is 127.0.0.1-only, for diagnostics.
      - "127.0.0.1:14002:4004"
      - "127.0.0.1:15900:5900"

  bot:
    build: .
    image: guardrail-trader:local
    restart: unless-stopped
    command: ["supercronic", "/app/docker/crontab"]    # every 15 min -> scripts/scheduled_run.py
    env_file: .env                                      # API key, LLM caps, TRADING_MODE, ...
    environment:
      IBKR_HOST: ib-gateway                             # overrides .env (which says 127.0.0.1)
      IBKR_PORT: "4004"
    volumes:
      - ./data:/app/data            # journal.sqlite, runs/, scheduler state/heartbeat
      - ./logs:/app/logs            # per-run logs
      - ./config:/app/config:ro     # risk.toml + universe (edit on host, no rebuild)
    depends_on:
      - ib-gateway
    networks: [broker, bot_egress]       # broker: IB Gateway API; egress: Claude API
    healthcheck:                    # scheduler heartbeat must be < 20 min old
      test: ["CMD", "python", "-c", "import json,sys,datetime as d; t=d.datetime.fromisoformat(json.load(open('/app/data/scheduler_heartbeat.json'))['last_tick_ny']); sys.exit(0 if (d.datetime.now(d.timezone.utc)-t).total_seconds()<1200 else 1)"]
      interval: 5m
      timeout: 10s
      start_period: 20m
      retries: 1

  dashboard:
    image: guardrail-trader:local
    restart: unless-stopped
    command: ["python", "scripts/dashboard.py", "--host", "0.0.0.0", "--no-browser"]
    environment:                    # least privilege: no API key in this container
      LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-2.50}
    volumes:
      - ./data:/app/data            # read by the dashboard (SQLite needs rw for its lock files)
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8765:8765"       # private to this Mac (same URL as the native dashboard)
    networks: [web]                 # cannot reach ib-gateway: the IB API has no auth

networks:
  broker:            # IB Gateway API. internal = no route in or out; only ib-gateway + bot attached
    internal: true
  gateway_egress: {} # ib-gateway -> IBKR servers (and the 127.0.0.1-only host ports)
  bot_egress: {}     # bot -> Claude API
  web: {}            # dashboard -> 127.0.0.1:8765 on the host

secrets:
  tws_password:
    file: docker/secrets/tws_password.txt
  vnc_password:
    file: docker/secrets/vnc_password.txt
